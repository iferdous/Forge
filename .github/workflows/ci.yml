name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jit-smoke:
    name: JIT smoke · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2025
            platform: windows-x64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install the NumPy reference dependency
        run: "python -m pip install --only-binary=:all: -r requirements.txt"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .local/toolchains/llvm-23.1.6-${{ matrix.platform }}
          key: llvm-sdk-${{ matrix.platform }}-${{ hashFiles('cmake/ProvisionLLVM.cmake') }}

      - name: Verify runner and provision LLVM
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'X64') { throw "Expected x64, got $env:RUNNER_ARCH" }
          Write-Host "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:ImageOS)"
          cmake --version
          cmake "-DFORGE_LLVM_PLATFORM=${{ matrix.platform }}" -P cmake/ProvisionLLVM.cmake

      - name: Configure
        shell: pwsh
        run: |
          $llvmDir = Get-Content .local/llvm-dir-${{ matrix.platform }}.txt
          $generator = @()
          if ($IsWindows) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (!$vs) { throw 'Visual Studio with the x64 C++ toolchain was not found' }
            $generator = @(
              '-A', 'x64',
              "-DMSVC_DIA_SDK_DIR=$vs/DIA SDK",
              "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
              '-DVCPKG_TARGET_TRIPLET=x64-windows-static'
            )
          }
          $python = (Get-Command python).Source
          cmake --preset release "-DLLVM_DIR=$llvmDir" "-DPython_EXECUTABLE=$python" -DFORGE_BUILD_BENCHMARKS=ON @generator

      - name: Build
        run: cmake --build --preset release --parallel 4

      - name: Run the graph, Python reference, and JIT tests
        run: ctest --preset release --verbose

      - name: Verify fusion and record matched warm timings
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $llvmDir = Get-Content .local/llvm-dir-${{ matrix.platform }}.txt
          $sdk = Join-Path $llvmDir '../../..'
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $objdump = (Resolve-Path (Join-Path $sdk "bin/llvm-objdump$suffix")).Path
          $benchmark = (Resolve-Path ".local/build/release/bench/forge_native_bench$suffix").Path
          $env:PYTHONPATH = (Resolve-Path .local/build/release/python).Path
          $out = '.local/evidence/stage-05'
          New-Item -ItemType Directory -Force $out | Out-Null
          $cpu = if ($IsWindows) {
            (Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()
          } else {
            $line = (Select-String -Path /proc/cpuinfo -Pattern '^model name\s*:' | Select-Object -First 1).Line
            ($line -split ':', 2)[1].Trim()
          }
          @{ cpu = $cpu; os = $env:RUNNER_OS; arch = $env:RUNNER_ARCH; image = $env:ImageOS; commit = $env:GITHUB_SHA; llvm = '23.1.6' } |
            ConvertTo-Json | Set-Content -Encoding utf8 "$out/host.json"
          python bench/inspect_simd.py --objdump "$objdump" --out "$out"
          & $benchmark --benchmark_min_time=0.02s --benchmark_min_warmup_time=0.01 --benchmark_repetitions=5 --benchmark_enable_random_interleaving=true "--benchmark_out=$out/native.json" --benchmark_out_format=json
          python bench/python_baseline.py --out "$out/python.json"

      - name: Upload the Stage 05 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage-05-${{ matrix.platform }}
          path: .local/evidence/stage-05/
          include-hidden-files: true
