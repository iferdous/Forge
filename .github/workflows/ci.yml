name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jit-smoke:
    name: JIT smoke · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2025
            platform: windows-x64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .local/toolchains/llvm-23.1.6-${{ matrix.platform }}
          key: llvm-sdk-${{ matrix.platform }}-${{ hashFiles('cmake/ProvisionLLVM.cmake') }}

      - name: Verify runner and provision LLVM
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'X64') { throw "Expected x64, got $env:RUNNER_ARCH" }
          Write-Host "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:ImageOS)"
          cmake --version
          cmake "-DFORGE_LLVM_PLATFORM=${{ matrix.platform }}" -P cmake/ProvisionLLVM.cmake

      - name: Configure
        shell: pwsh
        run: |
          $llvmDir = Get-Content .local/llvm-dir-${{ matrix.platform }}.txt
          $generator = @()
          if ($IsWindows) { $generator = @('-A', 'x64') }
          cmake --preset release "-DLLVM_DIR=$llvmDir" @generator

      - name: Build
        run: cmake --build --preset release --parallel 4

      - name: Execute the JIT smoke test
        run: ctest --preset release --verbose
