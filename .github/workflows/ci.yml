name: Forge CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jit-smoke:
    name: Release checks · ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2025
            platform: windows-x64

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install NumPy and benchmark tools
        run: "python -m pip install --only-binary=:all: -r requirements.txt -r examples/camera_preview/requirements.txt threadpoolctl==3.6.0 matplotlib==3.10.8"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .local/toolchains/llvm-23.1.6-${{ matrix.platform }}
          key: llvm-sdk-${{ matrix.platform }}-${{ hashFiles('cmake/ProvisionLLVM.cmake') }}

      - name: Verify runner and provision LLVM
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'X64') { throw "Expected x64, got $env:RUNNER_ARCH" }
          Write-Host "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:ImageOS)"
          cmake --version
          cmake "-DFORGE_LLVM_PLATFORM=${{ matrix.platform }}" -P cmake/ProvisionLLVM.cmake

      - name: Configure
        shell: pwsh
        run: |
          $llvmDir = Get-Content .local/llvm-dir-${{ matrix.platform }}.txt
          $generator = @()
          if ($IsWindows) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (!$vs) { throw 'Visual Studio with the x64 C++ toolchain was not found' }
            $generator = @(
              '-A', 'x64',
              "-DMSVC_DIA_SDK_DIR=$vs/DIA SDK",
              "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
              '-DVCPKG_TARGET_TRIPLET=x64-windows-static'
            )
          }
          $python = (Get-Command python).Source
          cmake --preset release "-DLLVM_DIR=$llvmDir" "-DPython_EXECUTABLE=$python" -DFORGE_BUILD_BENCHMARKS=ON @generator

      - name: Build
        run: cmake --build --preset release --parallel 4

      - name: Run the graph, Python reference, and JIT tests
        run: ctest --preset release --verbose

      - name: Verify the camera preview example
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path .local/build/release/python).Path
          $env:PYTHONDONTWRITEBYTECODE = '1'
          python -m unittest discover -s examples/camera_preview -p 'test_*.py' -v

      - name: Reproduce the full benchmark grid
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $llvmDir = Get-Content .local/llvm-dir-${{ matrix.platform }}.txt
          $sdk = Join-Path $llvmDir '../../..'
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $objdump = (Resolve-Path (Join-Path $sdk "bin/llvm-objdump$suffix")).Path
          $native = (Resolve-Path ".local/build/release/bench/forge_native_suite$suffix").Path
          $env:PYTHONPATH = (Resolve-Path .local/build/release/python).Path
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:OPENBLAS_NUM_THREADS = '1'
          $env:MKL_NUM_THREADS = '1'
          $out = '.local/evidence/stage-08'
          python bench/suite.py --profile ci-smoke --out "$out" --native "$native" --objdump "$objdump"
          python bench/suite_report.py "$out"

      - name: Capture showcase executions and isolated process memory
        if: runner.os == 'Linux'
        run: |
          llvm_dir=$(cat .local/llvm-dir-linux-x64.txt)
          PYTHONPATH="$PWD/.local/build/release/python" PYTHONDONTWRITEBYTECODE=1 \
            python showcase/capture.py --require-avx2 --objdump "$llvm_dir/../../../bin/llvm-objdump" \
            --out .local/evidence/stage-08/showcase-captures.json

      - name: Record the 30-second native AVX2 demo
        if: runner.os == 'Linux'
        run: |
          python -m pip install --only-binary=:all: imageio-ffmpeg==0.6.0
          PYTHONPATH="$PWD/.local/build/release/python" PYTHONDONTWRITEBYTECODE=1 \
            python release/record_demo.py .local/evidence/stage-08 --out .local/evidence/stage-08

      - name: Measure recorded camera frames on native AVX2
        if: runner.os == 'Linux'
        run: |
          python -m pip install --only-binary=:all: numexpr==2.14.2
          llvm_dir=$(cat .local/llvm-dir-linux-x64.txt)
          PYTHONPATH="$PWD/.local/build/release/python" PYTHONDONTWRITEBYTECODE=1 \
            NUMEXPR_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 \
            python -m examples.camera_preview.benchmark --numexpr --require-avx2 \
              --objdump "$llvm_dir/../../../bin/llvm-objdump" --out .local/evidence/camera-preview

      - name: Upload camera preview evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: camera-preview-linux-x64
          path: .local/evidence/camera-preview/
          include-hidden-files: true

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage-08-${{ matrix.platform }}
          path: |
            .local/evidence/stage-08/
            !.local/evidence/stage-08/.matplotlib/
          include-hidden-files: true

  native-hardening:
    name: Linux x64 sanitizers and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .local/toolchains/llvm-23.1.6-linux-x64
          key: llvm-sdk-linux-x64-${{ hashFiles('cmake/ProvisionLLVM.cmake') }}

      - name: Provision LLVM and the instrumentation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 llvm-18 libclang-rt-18-dev
          cmake -DFORGE_LLVM_PLATFORM=linux-x64 -P cmake/ProvisionLLVM.cmake

      - name: Build the instrumented native tests
        run: |
          llvm_dir=$(cat .local/llvm-dir-linux-x64.txt)
          # The SDK omits RTTI. JIT entry points have no Clang function-type preamble.
          cmake -S . -B .local/build/hardening -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            "-DLLVM_DIR=$llvm_dir" -DFORGE_BUILD_PYTHON=OFF \
            "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize=vptr,function -fno-omit-frame-pointer -fprofile-instr-generate -fcoverage-mapping"
          cmake --build .local/build/hardening --parallel 4

      - name: Run ASan and UBSan tests and collect Forge source coverage
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
        run: |
          out=.local/evidence/stage-08-hardening
          build=.local/build/hardening
          mkdir -p "$out" "$build/profiles"
          printf '%s\n' "$GITHUB_SHA" > "$out/commit.txt"
          clang++-18 --version > "$out/compiler.txt"
          export LLVM_PROFILE_FILE="$PWD/$build/profiles/%p-%m.profraw"
          ctest --test-dir "$build" --verbose | tee "$out/ctest.log"
          llvm-profdata-18 merge -sparse "$build"/profiles/*.profraw -o "$build/forge.profdata"
          objects=("$build/forge_graph_tests" "-object=$build/forge_jit_tests" "-instr-profile=$build/forge.profdata")
          llvm-cov-18 report "${objects[@]}" "$PWD"/src/*.cpp | tee "$out/coverage.txt"
          llvm-cov-18 export -summary-only "${objects[@]}" "$PWD"/src/*.cpp > "$out/coverage.json"

      - name: Upload native hardening evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: stage-08-linux-hardening
          path: .local/evidence/stage-08-hardening/
          include-hidden-files: true
